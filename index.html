<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <title>Frontend Mentor | Contact form</title>

  <link rel="stylesheet" href="style.css">

</head>


<body>

  <div class="success-banner" id="success-banner">
    <p><strong>Message Sent!</strong></p>
    <p>Thanks for completing the form. We'll be in touch soon!</p>
  </div>


  <div class="contact-form">
    <h1>Contact Us</h1>

    <form>
      <div class="form-group">
        <label for="first-name">First Name</label>
        <input type="text" id="first-name" required>
        <span class="error-message">This field is required</span>
      </div>
      <div class="form-group">
        <label for="last-name">Last Name</label>
        <input type="text" id="last-name" required>
        <span class="error-message">This field is required</span>
      </div>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" required>
        <span class="error-message">This field is required</span>
      </div>

      <div class="form-group">
        <label>Query Type <span class="required">*</span></label>

        <div class="radio-group">
          <div class="radio-option">
            <input type="radio" id="general" name="query-type" value="general">
            <label for="general">General Enquiry</label>
          </div>
          <div class="radio-option">
            <input type="radio" id="support" name="query-type" value="support">
            <label for="support">Support Request</label>
          </div>
        </div>

        <span class="error-message">Please select a query type</span>
      </div>


  <div class="form-group">
    <label for="message">Message</label>
    <textarea id="message" required></textarea>
    <span class="error-message">This field is required</span>
  </div>
  <div class="form-group">
    <input type="checkbox" id="consent" required>
    <label for="consent">I consent to being contacted by the team</label>
    <span class="error-message">This field is required</span>
  </div>
  <button type="submit">Submit</button>
  </form>
  </div>
</body>

</html>
